[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callone"
version = "1.0.0"
description = "call + clone — 통화 녹음에서 두 화자의 목소리(TTS)와 말투(LLM 페르소나)를 로컬 오픈소스로 복제"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "callone" }]

dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "python-dotenv>=1.0",
  "cryptography>=42.0",
  "rich>=13.0",
  "typer>=0.9",
  "librosa>=0.10",
  "soundfile>=0.12",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12.0",
  "websocket-client>=1.7",   # avatar.py 가 avatar-server WS 에 붙는 동기 클라(import websocket). 영상통화용
]

[project.optional-dependencies]
heavy = [
  # ⚠️ 검증된 호환 핀 (로컬 디버깅 확정). 느슨하게 풀면 설치 충돌 재발.
  "numpy<2.4",                 # 2.4+ 는 numba/librosa 깨뜨림
  "speechbrain==1.0.2",        # 1.1.0 은 pyannote 로드시 k2_fsa lazy import 버그
  "transformers>=4.55.2",      # huggingface-hub 1.x 호환
  "pyannote.audio>=3.1,<4",    # 3.1 파이프라인 (4.x community-1 은 torch>=2.8 필요)
  "peft>=0.13",
  "accelerate>=1.0",
  "bitsandbytes>=0.44",
  "datasets>=3.0",
  "trl>=0.12",
  "faster-whisper>=1.0",
  # hdbscan 은 소스빌드(Cython) 필요라 [heavy] 에서 제외 — setup_server.sh 가 별도 설치.
  # 미설치여도 scikit-learn KMeans 로 폴백되어 동작.
  "scikit-learn>=1.3",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "jiwer>=3.0",
]
test = ["pytest>=8.0"]

# 각 스테이지 독립 CLI (§2.6, §5). entry point 로 노출.
[project.scripts]
callone-ingest      = "callone.ingest.s0_convert:main"
callone-restore     = "callone.restore.s1_restore:main"
callone-diarize     = "callone.diarize.s2_diarize:main"
callone-link        = "callone.diarize.s2b_link:main"
callone-profile     = "callone.profile.s25_profile:main"
callone-dialect     = "callone.profile.s25_dialect:main"
callone-transcribe  = "callone.asr.s3_transcribe:main"
callone-correct     = "callone.asr_adapt.make_correction_set:main"
callone-asr-train   = "callone.asr_adapt.whisper_finetune:main"
callone-build-tts   = "callone.dataset.build_tts:main"
callone-build-dlg   = "callone.dataset.build_dialogue:main"
callone-tts-laptop  = "callone.tts.train_laptop:main"
callone-llm-sft     = "callone.llm.prepare_sft:main"
callone-llm-train   = "callone.llm.train_lora:main"
callone-serve       = "callone.serve.app:main"
callone-bench       = "callone.serve.bench_latency:main"   # 통화 지연 단계별 실측(RunPod)
callone-pilot       = "callone.pilot:main"

[tool.setuptools.packages.find]
include = ["callone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
