# S5 경량 LLM (§15) — 폰 온디바이스, 한국어 일상대화 페르소나
# ※ §3 검증(2026-06): Qwen 3.5 가 한국어 품질 최강(201개 언어, 한국어 깊이) → 채택.
#   소형(~1.7B) Q4 ≈ 1GB → 폰 구동(llama.cpp/MLX/Ollama). Gemma 4 E2B 는 LiteRT 배포는 쉽지만 한국어 약간 아래.
base_model: "Qwen/Qwen3.5-4B"               # 실측(갤럭시북5 Pro/Arc 140V): int4 29.9 tok/s, 첫음성 ~1.5초 = 실시간 OK.
# ⚠️ 반드시 Arc iGPU 에서: OpenVINO device="GPU". CPU-only 면 7.5 tok/s(~3.4초)로 느림.
# 폴백(배터리/CPU): "Qwen/Qwen3.5-2B" (CPU 41 tok/s, ~1.4초). 초경량: "Qwen/Qwen3.5-0.8B".
runtime_backend: openvino                   # OpenVINO GenAI(int4, NPU 47TOPS/Arc iGPU). Lunar Lake 정답.
device: GPU                                 # GPU(Arc) | NPU | CPU
method: "qlora"
lora: {r: 16, alpha: 32, dropout: 0.05, target: "all-linear"}
# Qwen3.5 vocab ~248k → logits 거대. OOM 방지: 배치 작게 + seq 짧게(대화 짧음) + grad accum 으로 보정.
train: {epochs: 3, lr: 1.0e-4, bsz: 1, grad_accum: 16, max_seq_len: 1024}
chat_template: "qwen"                        # 토크나이저 내장 템플릿 사용(모델별 자동)
quantization: q4                             # 배포 시 GGUF Q4 (llama.cpp/Ollama) 또는 MLX
runtime: llama.cpp                           # llama.cpp | mlx | ollama (Qwen 은 LiteRT보다 이쪽)
output_dir: "models/llm_phone"
generation:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 256
