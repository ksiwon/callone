# S5 서버 LLM — **선택적 화자 페르소나 LoRA 학습(mode B, 고급)** + 하드웨어 티어 기본값에서 참조.
# ⚠️ 현재 기본 통화 서빙은 이 파일이 아니라 scripts/bootstrap_gpu.sh 가 받는 EXAONE GGUF +
#    llama-server 를 쓴다(serve.yaml llm.base_url). 빠른 제로샷 통화엔 이 파일 안 건드려도 됨.

# ── 모델(한국어 특화 EXAONE) ─────────────────────────────────────────────
serve_gguf_repo: "AetherArchitectural/EXAONE-3.5-7.8B-Instruct-abliterated-GGUF-ARM-Imatrix-Community"  # GGUF
serve_gguf_file: "EXAONE-3.5-7.8B-Instruct-abliterated-Q6_K-imat.gguf"
base_model: "LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct"   # LoRA SFT 학습 베이스(LG 한국어 특화)

method: "lora"
load_in_4bit: false             # bf16 LoRA 권장. VRAM 빠듯하면 true(QLoRA).
lora: {r: 16, alpha: 16, dropout: 0.05, target: "all-linear"}   # alpha=r, 전 레이어
train: {epochs: 3, lr: 1.0e-4, bsz: 4, grad_accum: 4, max_seq_len: 4096, bf16: true}
# ⚠️ Windows 파인튜닝 이슈 보고됨 → 학습은 Linux/A100 에서.
chat_template: "exaone"         # EXAONE 자체 ChatML 형식
enable_thinking: false          # 대화용: thinking 비활성(응답 지연 억제, §1-3)
export_format: "q4_k_m"         # 학습 후 GGUF 변환(속도/품질 균형)
output_dir: "models/llm_server"
generation:
  temperature: 0.7              # 사실질문 시 temp↓ (환각 억제)
  top_p: 0.8
  top_k: 20
  min_p: 0
  max_new_tokens: 256
