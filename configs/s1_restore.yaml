# S1 음질 복원 (§9)
# denoise → 대역확장/SR → (옵션)겹말 정리
denoise:
  backend: deepfilternet      # deepfilternet | clearvoice | none
  clearvoice_model: MossFormer2_SE_48K
enhance:
  backend: resemble           # resemble | clearvoice_sr | none
  target_sr: 48000
  strength: 0.6               # 과복원 가드가 자동 완화
# ⚠️ 과복원 가드 (§9): 원본 대비 화자 임베딩 유사도 모니터
timbre_guard:
  enabled: true
  min_cosine: 0.80            # 미만이면 enhance 강도 완화/롤백
  step_down: 0.2
report_samples: 10
