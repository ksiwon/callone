# S4 서버 TTS (§14) — callone_stack_decision.md(2026-06-14) §2 적용
# 기존 CosyVoice3 폐기 → Qwen3-TTS 1.7B (zero-shot + 감정 instruct 단일모델 통합).
# ※ §3 검증 의무: 고정 전 최신본 웹 재확인 후 README 기록.
# ⚠️ 로컬 가중치만. Alibaba 클라우드 보이스 API 호출 금지 (§2).
backend: qwen3-tts             # qwen3-tts | voxcpm2 | llasa-korean
model_id: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"   # 제로샷 클론 베이스(faster_qwen3_tts 로딩)
runtime: faster-qwen3-tts      # faster_qwen3_tts.FasterQwen3TTS (CUDA graph, 스트리밍 TTFA 97~159ms)
language: "Korean"             # ⚠️ 실 API 필수 인자(전체영문명). 한국어="Korean", 자동="Auto"
device: "cuda"                 # CUDA graph 백엔드 → NVIDIA GPU 필수(서버 4090). 노트북은 Piper 폴백
dtype: "bfloat16"              # from_pretrained dtype(bf16 기본)
sample_rate: 24000             # ⚠️ Qwen3-TTS 24kHz 강제 — 추론 전 리샘플(실제 sr 은 모델이 반환)
# ⚠️ faster_qwen3_tts 는 LoRA 어댑터 미지원(서빙). 아래 finetune 블록은 어댑터 산출용이나
#    서빙 적용 불가 → 화자 충실도는 zero-shot 참조음성(ref_wav) 품질로 결정. LoRA 충실도 필요 시 Piper.
finetune:
  method: lora
  epochs: 10
  lr: 2.0e-6                    # ⚠️ §2-4: 기본값 2e-5 금지 — 2e-6 고정
  lora_r: 16
  lora_alpha: 32
  batch_size: 4
  # 학습 전 체크: 24kHz 리샘플 / annotation 태그 제거 / 클립끝 1초 묵음 / commit 680d4e9+ / PR#178
ref_transcribe_model: "small"  # ref_text.txt 없을 때 자동전사용(권장: ref_text.txt 직접 두기)
inference:
  lora_scale: 0.3              # (서빙 미사용 — faster_qwen3_tts LoRA 미지원)
  chunk_size: 25               # 실측(2026-06-17): 8은 끊김 → 25가 톤/지연 최적(첫청크 ~0.67s)
  temperature: 0.5             # 0.9는 흔들림 → 0.5가 톤 안정(실측). 0.5~0.7 권장
streaming: true
# 감정 instruct 매핑(orchestrator 가 LLM emotion 키로 주입) — tts_qwen.EMOTION_MAP 와 동일 의미
emotion_instruct:
  happy:   "Speak with a bright, cheerful, and warm tone."
  sad:     "Speak with a low, slow, comforting, and sad tone."
  angry:   "Speak with an annoyed, sharp, and frustrated voice."
  neutral: "Speak in a natural, relaxed, conversational tone."
  excited: "Speak with high energy and an excited, upbeat tone."
output_dir: "models/tts_server"
eval:
  secs_min: 0.70               # 화자 유사도 임계
  self_wer_max: 0.10
