# S4 폰 TTS (§14) — 온디바이스, 경량, 한국어
# ※ §3 검증(2026-06): Kokoro + KokoClone 채택.
#   - Kokoro 82M, 한국어 지원, 실시간, 폰 탑재 가능.
#   - KokoClone = ECAPA-TDNN 화자 임베딩 교체로 **학습 0**(제로샷 클론). 우리가 이미 ECAPA 뽑음 → 딱 맞음.
backend: kokoro                # kokoro(+kokoclone) | piper | melotts | gpt-sovits
sample_rate: 24000
kokoro:
  speaker_encoder: ecapa       # ECAPA-TDNN(우리 임베딩과 동일 계열)
  # 화자별 대표 임베딩을 정제 코퍼스에서 평균내어 사용
  ref_clips_topk_snr: 50       # SNR 상위 N개 클립으로 화자 임베딩 산출
# per-speaker 고충실 대안(학습 필요): piper/melotts/kitten — 데이터 풍부(화자 A 73분/화자 B 131분)라 가능
fallback_backend: melotts      # Kokoro 클론 음색이 부족하면 per-speaker 학습으로 전환
output_dir: "models/tts_phone"
