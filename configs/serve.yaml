# S6/S7 실시간 서빙 (§16, §17)
host: "0.0.0.0"
port: 8000
# 실행 티어: auto 면 하드웨어 감지(common/hardware.detect_tier) — v2 VRAM 4단.
#   ultra(≥70GB: H100/A100-80) | high(20~70GB: 3090/3090Ti/4090) | mid(10~20GB) | cpu(무GPU)
#   레거시 server_gpu/laptop_cpu 도 해석됨. CALLONE_TIER 환경변수로 강제 가능.
tier: auto
mode: server                   # server(고품질) | laptop(경량) — tier 가 우선
# 워밍업: Orchestrator 생성 시 ASR/LLM/TTS 더미 1회 예열(CUDA graph 빌드 + ref 인코딩 캐시 +
# llama-server 슬롯). 첫 통화 턴의 콜드스타트(수 초)를 셋업 시간으로 옮긴다. 목소리 영향 0.
# (스모크/CI 처럼 모델 없이 폴백만 돌릴 땐 false 로 두면 빠름.)
warmup: true
# 프라이버시: false(기본) 면 로그에 사용자 발화/응답 본문을 절대 안 남긴다(길이·지연만).
# 디버그로 잠깐 볼 때만 true. 개인데이터 로그 누출 원천차단.
log_content: false
vad:
  backend: energy              # energy(torch-free, OV 호환) | silero(torch, 별도 프로세스 권장)
  end_silence_ms: 200
asr:
  stream: true
  # v2 백엔드: auto=티어별(high/ultra→qwen3, mid/cpu→whisper) | qwen3 | whisper.
  #   qwen3 = Qwen3-ASR(한국어 52언어, serve venv 에 pip install qwen-asr). 실패 시 whisper 자동 폴백.
  backend: auto
  qwen_model: ""                      # 비면 티어 기본(high:0.6B, ultra:1.7B — hardware.tier_defaults)
  # v2 스트리밍 partial: 발화 **중** 주기 재전사 → UI 자막 + 턴 종료 시 ASR 지연 ≈ 0 (REBUILD_PLAN §2).
  partial: true
  partial_interval_ms: 600            # 재전사 주기(↓=자막 반응↑/GPU 부담↑)
  model_dir: "models/asr_dialect"     # 방언 적응본 있으면 자동 우선(whisper 백엔드)
  model: "auto"                       # auto=티어별(GPU:turbo, CPU:small). 고정도 가능
  beam_size: 1                        # greedy → 실시간 지연 최소
llm:
  # 백엔드 선택 (callone_stack_decision.md §3: llama.cpp 채택):
  #   llama = llama-server(HTTP, OpenAI 호환) EXAONE-4.0-32B(A100/H100) / 3.5-7.8B(24GB)
  #   ov    = OpenVINO EXAONE-3.5-2.4B(Arc 노트북)
  #   auto  = llama 먼저 시도(서버 떠있으면), 없으면 ov → 폴백
  backend: auto                # auto | llama | ov  (auto=llama 먼저, 없으면 ov → 폴백)
  base_url: "http://127.0.0.1:8090"   # llama-server 주소(Elice 가 8080 점유 → 8090 기본. bootstrap 이 PORT 로 동기)
  config: llm_laptop           # llm_server(학습용) | llm_laptop(노트북 EXAONE-3.5-2.4B)
  enable_thinking: false       # §1-3: 대화용 thinking 비활성(응답 지연 억제)
  # 기억 회상: auto = 화자에 memories.json/utterances.json 있으면 자동 ON(없으면 OFF).
  #   파이프라인: 통화녹음 → callone-pilot(전사) → scripts/extract_memories.py → 자동 회상.
  use_rag: auto                # auto | true | false
  embedder: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # fastembed 지원본(한국어 OK)
  rag_min_score: 0.45          # 게이트(MiniLM 기준): 미만이면 기억 안 씀. 허위회상 잦으면 ↑, 회상 약하면 ↓
  temperature: 0.4             # 실측(EXAONE-3.5-7.8B): 0.7=비문 잦음, 0.4=문법 안정. 반복은 temp 가 아니라
                               # DRY+프롬프트로 잡으므로 0.4 유지(변수 격리). 더 생생하게는 0.5~0.6 A/B(비문 trade).
  # top_p / top_k: _payload 에서 llama-server 로 보내지 않음(미사용). 샘플링=temperature+min_p+DRY.
  # 활성화하려면 llama_llm._payload 에 "top_p"/"top_k" 키를 추가해야 한다.
  # 반복/되묻기 억제(작업2) — DRY 샘플러가 주력. n-gram 반복만 끊고 한국어 문법은 안 건드림.
  #   페널티 강하게의 부작용("그치마니/하렴 야호" 비문) 없이 "같은 질문 반복"·"뭐.뭐.뭐." 차단.
  min_p: 0.05                  # 저확률 토큰 컷(top_k/top_p 보조) — 자연스러움 강건
  dry_multiplier: 0.8          # 0=off. 반복 더 세게 막으려면 ↑(과하면 정상 반복어구도 회피)
  dry_base: 1.75
  dry_allowed_length: 2        # 이 길이까지의 n-gram 반복은 허용(2=짧은 반복만 봐줌)
  max_new_tokens: 96           # 160 은 모델이 다 채우려 주절대다 끝에서 잘림. 96 + 강한 '1~2문장' 프롬프트로
                               # 짧게 끝나게(통화감↑·합성 빨라짐). 짧은 답이라 96 안에서 자연히 EOS.
  # 통화 맥락 누적: LLM 에 넘길 최근 메시지 수(=N/2턴). 24=12턴. 통화가 길게 이어져도
  # 앞 맥락 기억. RAG off(시스템 프롬프트 고정)면 llama.cpp prefix 캐시로 길어도 저렴 →
  # 더 길게(40~) 가능. RAG on 이면 매 턴 시스템이 바뀌어 캐시 깨지니 과하게 키우지 말 것.
  max_history: 24
tts:
  # v2 체인: qwen3tts(:8093, 12Hz 스트리밍 저지연) → cosyvoice3(:8092) → piper → kokoro.
  #   기본값 cosyvoice3 유지 — ⚠️ 과거 Qwen3 계열 TTS "턴마다 음색 튐" 실측 기각 이력.
  #   신형(Qwen3-TTS-12Hz)은 scripts/bench_v2.py 음색 안정성 게이트 통과 후에만 auto/qwen3tts 로 승격.
  backend: cosyvoice3          # qwen3tts | cosyvoice3 | auto(qwen 우선+폴백) | piper | kokoro
  cosyvoice_url: "http://127.0.0.1:8092"
  qwen_tts_url: "http://127.0.0.1:8093"   # qwen-tts-server (scripts/setup_qwen_tts_gpu.sh)
  ref_transcribe_model: "large-v3-turbo"
  # 작업1 TTS 스트리밍: true=서버 /synth_stream(네이티브 bistream, 첫음성 ~1.3s→~0.3s).
  #   ⚠️ 우선순위①(목소리)이라 **기본 false**(통짜 /synth). 박스에서 저장 wav A/B(통짜 vs 스트리밍 음색 동일)
  #   + 라이브 끊김 없음 확인 후에만 true(메모리 'A/B 통과 전 라이브 금지').
  stream: false
  # ⚠️ 음색 샘플링 튜닝(seed·temperature·stream chunk)은 여기가 아니라 **cosyvoice_server 측**이다:
  #   COSYVOICE_SEED env(기본 1234, >=0 고정 → 턴 음색 편차 0). serve.yaml 엔 안 실림(과거 죽은 키라 제거).
  #   A/B(A100 2026-06-20): stream chunk 25→776ms·15→501·10→366ms, 음색은 거의 불변.
  # 감정 instruct: 동적 톤 변화. 단 instruct 가 제로샷 음색을 원본에서 밀어내 **덜 닮게** 만들고,
  # 톤이 문맥과 안 맞으면 더 어색. 실통화 판정(2026-06-20): 충실도 최우선 → false(neutral 고정).
  emotion: false
  # 합성 단위: full = 응답 통째 1회(운율 일관·톤 안 튐, 턴제/짧은응답 권장) /
  #           sentence = 문장별(첫음성 최저지연, WS 실시간용). 문장 사이엔 무음 텀.
  synth_mode: full
  sentence_pause_ms: 180       # 문장 사이 무음(급박함 완화). 0 이면 없음
  # 레퍼런스: 통화 시작 시 프론트가 보낸 음성으로 인메모리 설정(/dev/shm, 끊기면 즉시 삭제) — 제로샷 전용
  #   (ephemeral). 디스크 ref/자동전사/디스크 파일 없음(cosyvoice 백엔드는 인메모리 ref 만 받음).
# 토킹헤드(사진→움직이는 얼굴, 영상통화) — docs/AVATAR_RUN.md.
# 증명사진 1장 + TTS 음성 → 입·표정·고개. 음성의 부가 레이어(모델 없으면 정지사진 폴백).
avatar:
  enabled: true                # 영상통화 on. 사진 업로드 시 프레임 생성(백엔드 static→정지, ditto→움직임).
                               # 사진 안 올리면 init_session 이 자동 스킵(음성전용). avatar-server 다운이면 static 폴백.
  backend: auto                # auto | ditto | static  (auto=avatar-server 있으면 Ditto, 없으면 static)
  base_url: "http://127.0.0.1:8091"   # avatar-server(별 venv·별 프로세스, GPU)
  image: ""                    # 예: data/speakers/A/portrait.jpg (png/jpg/jpeg). 비면 화자 폴더 자동탐색
  fps: 25
  resolution: 256              # 256 | 512 (VRAM/지연 trade)
  frame_format: jpeg           # jpeg (1차) | h264 (WebRTC 스케일 시)
