# S6/S7 실시간 서빙 (§16, §17)
host: "0.0.0.0"
port: 8000
# 실행 티어: auto 면 하드웨어 감지(common/hardware.detect_tier).
#   server_gpu(H100) | laptop_cpu(32GB 노트북·무GPU) | phone(온디바이스)
# CALLONE_TIER 환경변수로 강제 가능.
tier: auto
mode: server                   # server(고품질) | phone(온디바이스) — tier 가 우선
vad:
  backend: energy              # energy(torch-free, OV 호환) | silero(torch, 별도 프로세스 권장)
  end_silence_ms: 200
asr:
  stream: true
  model_dir: "models/asr_dialect"     # 방언 적응본 있으면 자동 우선
  model: "auto"                       # auto=티어별(GPU:turbo, CPU:small). 고정도 가능
  # ⚠️ §3: turbo 가 현 시점 최선인지 착수 시 재확인(Voxtral/Canary 등)
  beam_size: 1                        # greedy → 실시간 지연 최소
llm:
  # 백엔드 선택 (callone_stack_decision.md §3: llama.cpp 채택):
  #   llama = llama-server(HTTP, OpenAI 호환) Qwen3.5-9B(서버) / 4B(노트북) + LoRA
  #   ov    = OpenVINO base Qwen3-4B(Arc, 변환 가능한 모델만)
  #   auto  = llama 먼저 시도(서버 떠있으면), 없으면 ov → 폴백
  backend: auto                # auto | llama | ov | vllm
  base_url: "http://127.0.0.1:8080"   # llama-server 주소(8080 통일 — llama-server --port 와 일치시킬 것)
  config: llm_phone            # llm_server(서버 Qwen3.5-9B) | llm_phone(노트북 4B)
  enable_thinking: false       # §1-3: 대화용 thinking 비활성(응답 지연 억제)
  # 기억 회상: extract_memories.py 로 memories.json 만든 뒤 true 권장(의미검색=삼천포 없음).
  use_rag: false               # 사실 추출 후 true 로
  embedder: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # fastembed 지원본(한국어 OK)
  rag_min_score: 0.45          # 게이트(MiniLM 기준): 미만이면 기억 안 씀. 허위회상 잦으면 ↑, 회상 약하면 ↓
  temperature: 0.4             # 낮추면 덜 산만(횡설수설 억제)
  top_p: 0.8
  top_k: 20
  max_new_tokens: 64           # 전화 턴 짧게(LoRA 가 길게 주절거리는 것 캡)
tts:
  backend: qwen3-tts           # §2: Qwen3-TTS 1.7B(감정 instruct 통합). 미설치 시 piper/kokoro 폴백
  stream: true
  first_chunk_target_ms: 700   # 실측: chunk_size=25 → 워밍업 후 첫청크 ~0.67s
  chunk_size: 25               # 실측(2026-06-17): 8은 끊김 → 25가 톤/지연 최적
  temperature: 0.5             # 실측: 0.9 흔들림 → 0.5 톤 안정
  emotion: true                # LLM emotion 키 → instruct 동적 주입
  # 제로샷 참조(7~10초, 24kHz, 잡음 없음). ref_wav 비면 data/speakers/{spk}/ref_24k.wav 자동탐색.
  # ref_text 비면 같은 폴더 ref_text.txt → 없으면 자동전사(품질 위해 ref_text.txt 권장).
  ref_wav: ""                  # 예: data/speakers/A/ref_24k.wav
  ref_text: ""                 # 비우면 ref_text.txt/자동전사로 해결
orchestration: pipecat         # Pipecat + LiveKit(WebRTC)
latency_budget_ms: 1200        # 첫 음성 < 1.2s, 목표 0.8s
rag:
  enabled: true
  vector_db: faiss             # faiss | chroma | qdrant | sqlite-vss
  embedder: "google/embeddinggemma"
memory:
  backend: mem0                # mem0 | zep
