# S6/S7 실시간 서빙 (§16, §17)
host: "0.0.0.0"
port: 8000
# 실행 티어: auto 면 하드웨어 감지(common/hardware.detect_tier).
#   server_gpu(H100/A100/4090) | laptop_cpu(노트북 Arc iGPU)   ※ 폰 경로 폐기
# CALLONE_TIER 환경변수로 강제 가능.
tier: auto
mode: server                   # server(고품질) | laptop(경량) — tier 가 우선
# 워밍업: Orchestrator 생성 시 ASR/LLM/TTS 더미 1회 예열(CUDA graph 빌드 + ref 인코딩 캐시 +
# llama-server 슬롯). 첫 통화 턴의 콜드스타트(수 초)를 셋업 시간으로 옮긴다. 목소리 영향 0.
# (스모크/CI 처럼 모델 없이 폴백만 돌릴 땐 false 로 두면 빠름.)
warmup: true
# 프라이버시: false(기본) 면 로그에 사용자 발화/응답 본문을 절대 안 남긴다(길이·지연만).
# 디버그로 잠깐 볼 때만 true. 개인데이터 로그 누출 원천차단.
log_content: false
vad:
  backend: energy              # energy(torch-free, OV 호환) | silero(torch, 별도 프로세스 권장)
  end_silence_ms: 200
asr:
  stream: true
  model_dir: "models/asr_dialect"     # 방언 적응본 있으면 자동 우선
  model: "auto"                       # auto=티어별(GPU:turbo, CPU:small). 고정도 가능
  # ⚠️ §3: turbo 가 현 시점 최선인지 착수 시 재확인(Voxtral/Canary 등)
  beam_size: 1                        # greedy → 실시간 지연 최소
llm:
  # 백엔드 선택 (callone_stack_decision.md §3: llama.cpp 채택):
  #   llama = llama-server(HTTP, OpenAI 호환) EXAONE-3.5-7.8B(서버) / Qwen3.5-4B(노트북) + LoRA
  #   ov    = OpenVINO base Qwen3-4B(Arc, 변환 가능한 모델만)
  #   auto  = llama 먼저 시도(서버 떠있으면), 없으면 ov → 폴백
  backend: auto                # auto | llama | ov | vllm
  base_url: "http://127.0.0.1:8090"   # llama-server 주소(Elice 가 8080 점유 → 8090 기본. bootstrap 이 PORT 로 동기)
  config: llm_laptop           # llm_server(서버 EXAONE-3.5-7.8B) | llm_laptop(노트북 EXAONE-3.5-2.4B)
  enable_thinking: false       # §1-3: 대화용 thinking 비활성(응답 지연 억제)
  # thinking off 방식: none=EXAONE(enable_thinking:false 로 충분, /no_think 미주입) /
  #   qwen=Qwen3.5 만(시스템에 리터럴 /no_think 주입해 thinking 강제주입 버그 #20182 차단).
  #   현 서빙=EXAONE → none. Qwen 계열로 바꾸면 qwen.
  thinking_workaround: none
  # 기억 회상: extract_memories.py 로 memories.json 만든 뒤 true 권장(의미검색=삼천포 없음).
  use_rag: false               # 사실 추출 후 true 로
  embedder: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # fastembed 지원본(한국어 OK)
  rag_min_score: 0.45          # 게이트(MiniLM 기준): 미만이면 기억 안 씀. 허위회상 잦으면 ↑, 회상 약하면 ↓
  temperature: 0.4             # 실측(EXAONE-3.5-7.8B): 0.7=비문 잦음, 0.4=문법 안정. 반복은 temp 가 아니라
                               # DRY+프롬프트로 잡으므로 0.4 유지(변수 격리). 더 생생하게는 0.5~0.6 A/B(비문 trade).
  top_p: 0.8                   # ⚠️ 참고: 현재 _payload 는 top_p/top_k 를 안 보냄(미사용). 샘플링=temperature+min_p+DRY.
  top_k: 20
  # 반복/되묻기 억제(작업2) — DRY 샘플러가 주력. n-gram 반복만 끊고 한국어 문법은 안 건드림.
  #   페널티 강하게의 부작용("그치마니/하렴 야호" 비문) 없이 "같은 질문 반복"·"뭐.뭐.뭐." 차단.
  min_p: 0.05                  # 저확률 토큰 컷(top_k/top_p 보조) — 자연스러움 강건
  dry_multiplier: 0.8          # 0=off. 반복 더 세게 막으려면 ↑(과하면 정상 반복어구도 회피)
  dry_base: 1.75
  dry_allowed_length: 2        # 이 길이까지의 n-gram 반복은 허용(2=짧은 반복만 봐줌)
  max_new_tokens: 96           # 160 은 모델이 다 채우려 주절대다 끝에서 잘림. 96 + 강한 '1~2문장' 프롬프트로
                               # 짧게 끝나게(통화감↑·합성 빨라짐). 짧은 답이라 96 안에서 자연히 EOS.
  # 통화 맥락 누적: LLM 에 넘길 최근 메시지 수(=N/2턴). 24=12턴. 통화가 길게 이어져도
  # 앞 맥락 기억. RAG off(시스템 프롬프트 고정)면 llama.cpp prefix 캐시로 길어도 저렴 →
  # 더 길게(40~) 가능. RAG on 이면 매 턴 시스템이 바뀌어 캐시 깨지니 과하게 키우지 말 것.
  max_history: 24
tts:
  # cosyvoice3 = 제로샷 클론 음색 안정(실측: Qwen3-TTS 는 턴마다 음색 튐 → CosyVoice3-0.5B 채택).
  # 별 프로세스(:8092, conda env) — setup_cosyvoice_gpu.sh. 서버 다운이면 qwen3-tts 자동 폴백.
  backend: cosyvoice3          # cosyvoice3 | qwen3-tts | piper | kokoro
  cosyvoice_url: "http://127.0.0.1:8092"
  # 작업1 TTS 스트리밍: true=서버 /synth_stream(네이티브 bistream, 첫음성 ~1.3s→~0.3s).
  #   ⚠️ 우선순위①(목소리)이라 **기본 false**(통짜 /synth=현 동작). 박스에서 저장 wav A/B 로 통짜 vs
  #   스트리밍 음색 동일 확인 + 라이브 끊김 없음 확인 후에만 true 로(메모리 'A/B 통과 전 라이브 금지').
  stream: false
  first_chunk_target_ms: 500   # 실측(A100): chunk_size=15 → 워밍업 후 첫청크 ~0.5s
  # ⚠️ 첫음성 지연의 최대 단일 병목. A100 A/B(2026-06-20): cs 25→776ms·20→637·15→501·10→366ms.
  # 음색은 cs 줄여도 거의 불변(사용자 귀 판정) → 15 채택(첫음성 1.64s→~1.29s). 더 줄이려면 10까지
  # 가능하나 **실시간 스트리밍 끊김**은 저장 wav A/B 로 안 보임 → 라이브 통화로 확인 후 내려라(과거 cs=8 끊김).
  chunk_size: 15
  temperature: 0.5             # 실측: 0.9 흔들림 → 0.5 톤 안정
  seed: 1234                   # 시드 고정(>=0) → 턴마다 음색 편차 제거(우선순위①). -1=랜덤(편차↑)
  # 감정 instruct: 동적 톤 변화. 단 instruct 가 제로샷 음색을 원본에서 밀어내 **덜 닮게** 만들고,
  # 톤이 문맥과 안 맞으면 더 어색. 실통화 판정(2026-06-20): 충실도 최우선 → false(neutral 고정 = 최대 충실도).
  # 풍부한 감정이 더 중요하면 true(음색 충실도와 trade). 진짜 감정+충실도는 화자 학습본이 답.
  emotion: false
  # 합성 단위: full = 응답 통째 1회(운율 일관·톤 안 튐·구두점 자연 텀, 턴제/짧은응답 권장) /
  #           sentence = 문장별(첫음성 최저지연, WS 실시간용). 문장 사이엔 무음 텀.
  synth_mode: full
  sentence_pause_ms: 180       # 문장 사이 무음(급박함 완화). 0 이면 없음
  # 제로샷 참조(7~10초, 24kHz, 잡음 없음). ref_wav 비면 data/speakers/{spk}/ref_24k.wav 자동탐색.
  # ref_text 비면 같은 폴더 ref_text.txt → 없으면 자동전사(품질 위해 ref_text.txt 권장).
  ref_wav: ""                  # 예: data/speakers/A/ref_24k.wav
  ref_text: ""                 # 비우면 ref_text.txt/자동전사로 해결
  # 프라이버시 ephemeral(기본 on): 디스크 ref 없어도 TTS 생성 OK → 통화 시작 시 프론트가 보낸
  # 음성으로 인메모리 설정(/dev/shm, 끊기면 즉시 삭제). 디스크 파일 안 만듦. false=옛 동작(디스크 ref 필수).
  ephemeral: true
orchestration: pipecat         # Pipecat + LiveKit(WebRTC)
latency_budget_ms: 1200        # 첫 음성 < 1.2s, 목표 0.8s
# 토킹헤드(사진→움직이는 얼굴, 영상통화) — docs/avatar_talking_head_design.md.
# 증명사진 1장 + TTS 음성 → 입·표정·고개. 음성의 부가 레이어(모델 없으면 정지사진 폴백).
avatar:
  enabled: true                # 영상통화 on. 사진 업로드 시 프레임 생성(백엔드 static→정지, ditto→움직임).
                               # 사진 안 올리면 init_session 이 자동 스킵(음성전용). avatar-server 다운이면 static 폴백.
  backend: auto                # auto | ditto | static  (auto=avatar-server 있으면 Ditto, 없으면 static)
  base_url: "http://127.0.0.1:8091"   # avatar-server(별 venv·별 프로세스, GPU)
  image: ""                    # 예: data/speakers/A/portrait.jpg (png/jpg/jpeg). 비면 화자 폴더 자동탐색
  fps: 25
  resolution: 256              # 256 | 512 (VRAM/지연 trade)
  frame_format: jpeg           # jpeg (1차) | h264 (WebRTC 스케일 시)
rag:
  enabled: true
  vector_db: faiss             # faiss | chroma | qdrant | sqlite-vss
  embedder: "google/embeddinggemma"
memory:
  backend: mem0                # mem0 | zep
