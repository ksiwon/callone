# S5 노트북 LLM — 노트북 온디바이스(Arc iGPU), 한국어 일상대화 페르소나
# 서버(EXAONE-7.8B)와 같은 LG 한국어 특화 계열의 경량본 → 말투/한국어 일관.
# ※ 폰 온디바이스 경로는 폐기. 노트북(예: 갤럭시북5 Pro / Arc 140V)만 지원.
base_model: "LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct"   # 한국어 특화 2.4B(7.8B의 경량 형제)
# 실행: Arc iGPU int4(OpenVINO GenAI) 우선. 2.4B int4 ≈ 1.5GB → Arc 충분, 7.8B 대비 빠른 토큰레이트.
# ⚠️ 반드시 Arc iGPU 에서: OpenVINO device="GPU". CPU-only 면 느림.
runtime_backend: openvino                   # OpenVINO GenAI(int4, Arc iGPU/NPU)
device: GPU                                 # GPU(Arc) | NPU | CPU
method: "lora"                              # 2.4B dense → bf16 LoRA 가뿐(4bit 불필요)
load_in_4bit: false
lora: {r: 16, alpha: 16, dropout: 0.05, target: "all-linear"}
# 학습은 서버에서 LoRA 뽑아 노트북에 가져오기 권장. seq 짧게(대화 짧음).
train: {epochs: 3, lr: 1.0e-4, bsz: 1, grad_accum: 16, max_seq_len: 1024}
chat_template: "exaone"                      # EXAONE 자체 ChatML(서버와 동일 템플릿 → 말투 일관)
enable_thinking: false                       # 대화용: thinking 비활성(지연 억제)
quantization: int4                           # 배포: OpenVINO int4(Arc) 또는 GGUF Q4(llama.cpp)
runtime: openvino                            # openvino | llama.cpp
output_dir: "models/llm_laptop"
# 생성 파라미터 — 서버 EXAONE 실측 최적과 정렬(짧고 한국어 안정한 통화체).
generation:
  temperature: 0.4              # 0.7 은 한국어 비문↑ → 0.4 문법 안정(서버와 동일 기조)
  top_p: 0.8
  top_k: 20
  min_p: 0
  max_new_tokens: 96            # 통화체 1~2문장 → 짧게(첫음성 지연↓·합성 빠름)
